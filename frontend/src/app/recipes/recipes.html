<h1 class="section-title">All Recipes </h1>

<!-- Vergrößerte Toolbar -->
<div class="recipes-toolbar">
  <div class="toolbar-inner">
    <div class="search-group">
      <input
        type="search"
        id="search"
        placeholder="Search for recipe..."
        aria-label="Rezepte durchsuchen"
      />
    </div>
    <div class="select-group">
      <label for="sort" class="sr-only">Sortieren</label>
      <select id="sort" aria-label="Rezepte sortieren">
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="id-asc">ID ↑</option>
        <option value="id-desc">ID ↓</option>
      </select>
    </div>
  </div>
</div>

<div id="recipes-grid" class="recipes-grid fade-in-grid">
  @for (recipe of recipes; track recipe.id) {
    <app-recipe-card
      [altText]="recipe.name"
      [description]="recipe.description"
      [id]="recipe.id"
      [imageSource]="recipe.imagePath"
      [title]="recipe.name" />
  }
</div>
