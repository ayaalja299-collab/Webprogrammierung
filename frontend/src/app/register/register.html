<div class="section-content">
  <div class="register-form">
    <form #form="ngForm" (ngSubmit)="onSubmit()">
      <label>
        Username
        <input name="username" [(ngModel)]="username" required placeholder="Username..." />
      </label>
      <label>
        E-Mail
        <input name="e-mail" [(ngModel)]="email" required placeholder="E-Mail..." />
      </label>
      <label>
        Password
        <input name="password" [(ngModel)]="password" required placeholder="Password..." />
      </label>
      <span>{{ errorMessage$ | async }}</span>
      <button [disabled]="form.invalid">Register</button>
      <button routerLink="/login">Already Registered?<br />Login instead</button>
    </form>
  </div>
  <div class="register-image">
    <img src="assets/register-pic.jpg" alt="Sweet potato salad" />
  </div>
</div>
