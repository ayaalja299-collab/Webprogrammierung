<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All Recipes</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="rezepte.css"/>
</head>
<body>
<header>
    <nav class="navbar section-content">
        <a href="index.html" class="nav-logo"><h2 class="logo-text">Title</h2></a>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="rezepte.html" class="nav-link">Recipes</a></li>
        </ul>
    </nav>
</header>

<main class="section-content">
    <h1 class="section-title">All Recipes </h1>

    <!-- Vergrößerte Toolbar -->
    <div class="recipes-toolbar">
        <div class="toolbar-inner">
            <div class="search-group">
                <input
                        type="search"
                        id="search"
                        placeholder="Search for recipe..."
                        aria-label="Rezepte durchsuchen"
                />
            </div>
            <div class="select-group">
                <label for="sort" class="sr-only">Sortieren</label>
                <select id="sort" aria-label="Rezepte sortieren">
                    <option value="name-asc">Name A–Z</option>
                    <option value="name-desc">Name Z–A</option>
                    <option value="id-asc">ID ↑</option>
                    <option value="id-desc">ID ↓</option>
                </select>
            </div>
        </div>
    </div>

    <div id="recipes-grid" class="recipes-grid fade-in-grid">
        <!-- Karten werden per JS (rezepte.js) eingefügt -->
    </div>
</main>

<script src="rezepte.js"></script>
</body>
</html>
